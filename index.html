<!DOCTYPE html>
<html>
<head>
  <title>AI Agent Market Place</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <center><h1>AI MARKETPLACE</h1></center>
 <button class="cart-btn">
  🛒 Open Cart (<span class="cart-count">0</span>)
</button>

<div class="top-bar">
  <input type="text" id="search-input" placeholder="Search For Your AI Agent...">

</div>



  <!-- Products Section -->
  <div class="products-center"></div>

  <!-- Overlay -->
  <div class="cart-overlay"></div>

 

  <div class="cart">
    <span class="close-cart">✖</span>
    <h2>Your Cart</h2>
    <div class="cart-content"></div>
    <h3>Total: <span class="cart-total">0</span> $</h3>
    <button class="clear-cart">Clear Cart</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
